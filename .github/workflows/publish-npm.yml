name: Publish npm packages

# Configure npm Trusted Publishing for each package with this repository and
# workflow before creating a release. No npm token is stored in GitHub.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1
      - run: npm ci --ignore-scripts
      - name: Install verified Gitleaks
        run: |
          bash ci/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      - run: make public-gate
      - name: Publish packages with provenance
        shell: bash
        run: |
          set -euo pipefail
          for package in \
            packages/agentkit-harness-core \
            packages/agentkit-harness-node \
            packages/agentkit-harness-ui; do
            name="$(node -p "require('./${package}/package.json').name")"
            version="$(node -p "require('./${package}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} already published; skipping."
            else
              npm publish --workspace "${package}" --access public --provenance
            fi
          done
