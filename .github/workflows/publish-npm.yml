name: Publish npm packages

# Configure npm Trusted Publishing for each package with this repository and
# this workflow before creating a release. The job publishes through GitHub
# Actions OIDC and intentionally has no long-lived npm token fallback.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: npm-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Verify immutable published release and package versions
        run: node scripts/verify-release-context.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Assert GitHub OIDC publishing context
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
      - run: npm ci --ignore-scripts
      - name: Install verified Gitleaks
        run: |
          bash ci/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"
      - run: make public-gate
      - name: Publish packages with provenance
        run: node scripts/publish-native-release.mjs
      - name: Calculate the tested manifest digest
        id: studio-manifest-digest
        run: |
          digest="$(sha256sum .artifacts/packages/manifest.json | cut -d ' ' -f 1)"
          echo "digest=sha256:$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the tested Studio upgrade manifest
        id: studio-manifest
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: manifest.json
          subject-digest: ${{ steps.studio-manifest-digest.outputs.digest }}
      - name: Publish the signed Studio upgrade manifest
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION: ${{ steps.studio-manifest.outputs.bundle-path }}
        run: |
          cp .artifacts/packages/manifest.json .artifacts/studio-harness-release.json
          cp "$ATTESTATION" .artifacts/studio-harness-release.bundle.json
          gh release upload "${GITHUB_REF_NAME}" .artifacts/studio-harness-release.json .artifacts/studio-harness-release.bundle.json --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-release-evidence
          path: |
            .artifacts/npm-release-receipt.json
            .artifacts/packages/manifest.json
            .artifacts/installed-ui-proof.json
          if-no-files-found: error
